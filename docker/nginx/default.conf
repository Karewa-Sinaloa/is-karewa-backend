server {
    listen 80;
    server_name _;

    root /var/www/html/httpdocs;
    index index.php index.html;

    # Match .htaccess ErrorDocument behavior
    error_page 403 /errors/404.html;
    error_page 404 /errors/404.html;

    # Keep parity with RewriteCond %{REQUEST_URI} !^/robots\.txt$
    location = /robots.txt {
        try_files $uri =404;
    }

    # Internal health endpoint for container checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Default no-cache policy (from legacy .htaccess)
    add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "Wed, 11 Jan 1984 05:00:00 GMT" always;

    # ---- Rewrite equivalents from httpdocs/.htaccess ----
    rewrite ^/$ /api.php last;
    rewrite ^/api/?$ /api.php last;
    rewrite ^/api/v5/?$ /api.php last;
    rewrite ^/api/v5/([a-z-]+)/([a-z-]+)/([A-Za-z0-9]+)/?$ /api.php?m=$1&s=$2&id=$3 last;
    rewrite ^/api/v5/([a-z-]+)/([A-Za-z0-9]+)/([a-z-]+)/?$ /api.php?m=$1&id=$2&s=$3 last;
    rewrite ^/api/v5/([a-z-]+)/([a-z-]+)/?$ /api.php?m=$1&s=$2 last;
    rewrite ^/api/v5/([a-z-]+)/([A-Za-z0-9]+)/?$ /api.php?m=$1&id=$2 last;
    rewrite ^/api/v5/([a-z-]+)/?$ /api.php?m=$1 last;

    # Public error page allowed (must be before regex html block)
    location = /errors/404.html {
        root /var/www/html/httpdocs;
        try_files /errors/404.html =404;
    }

    # Static assets: allow aggressive cache
    location ~* \.(js|css|xml|gz|svg|jpg|jpeg|png|gif|ttf|otf|woff|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31557600" always;
        add_header Vary "Accept-Encoding" always;
    }

    # Only api.php can be executed via PHP-FPM
    location = /api.php {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass php:9000;
    }

    # Block direct PHP access except api.php
    location ~ \.php$ {
        return 404;
    }

    # Keep 404 page reachable; block other HTML by routing through ErrorDocument
    location ~ ^/(?!errors/404\.html$).+\.html$ {
        return 404;
    }

    # Fallback: keep API behavior similar to old routing
    location / {
        try_files $uri $uri/ /api.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }
}
