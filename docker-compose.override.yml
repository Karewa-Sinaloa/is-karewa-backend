services:
  php:
    volumes:
      - ./:/var/www/html

  nginx:
    ports:
      - ${NGINX_HOST_PORT:-8080}:80
    volumes:
      - ./:/var/www/html:ro

  db:
    ports:
      - ${DB_HOST_PORT:-3306}:3306

  mailpit:
    ports:
      - ${MAILPIT_UI_PORT:-8025}:8025
      - ${MAILPIT_SMTP_PORT:-1025}:1025
