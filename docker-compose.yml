services:
  php:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r 'exit(@fsockopen(getenv("DB_HOST") ?: "db", (int)(getenv("DB_PORT") ?: 3306)) ? 0 : 1);'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net

  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - app_net

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    user: "0:0"
    restart: unless-stopped
    profiles: ["cloudflared"]
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      CLOUDFLARED_TUNNEL_ID: ${CLOUDFLARED_TUNNEL_ID}
      CLOUDFLARED_CREDENTIALS_FILE: ${CLOUDFLARED_CREDENTIALS_FILE}
      CLOUDFLARED_HOSTNAME: ${CLOUDFLARED_HOSTNAME}
      CLOUDFLARED_TARGET_SERVICE: ${CLOUDFLARED_TARGET_SERVICE:-http://nginx:80}
    command:
      - tunnel
      - --no-autoupdate
      - --credentials-file
      - ${CLOUDFLARED_CREDENTIALS_FILE}
      - --url
      - ${CLOUDFLARED_TARGET_SERVICE:-http://nginx:80}
      - run
      - ${CLOUDFLARED_TUNNEL_ID}
    volumes:
      - ${CLOUDFLARED_HOST_CREDENTIALS_PATH:-/tmp/cloudflared/placeholder.json}:${CLOUDFLARED_CREDENTIALS_FILE:-/etc/cloudflared/placeholder.json}:ro
    networks:
      - app_net

networks:
  app_net: {}

volumes:
  db_data:
    name: karewa_db_data
